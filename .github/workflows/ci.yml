name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Build + unit tests (with ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run unit tests
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-g -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DNF_TX_CORE_BUILD_TESTS=ON
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Build the shared library (plain, non-sanitized)
        run: |
          cmake -B build-shared -S . -DCMAKE_BUILD_TYPE=Release -DNF_TX_CORE_BUILD_TESTS=OFF
          cmake --build build-shared -j"$(nproc)"

      # The tester runs THIS repo's fixtures through the app's exact call
      # path (initWithData -> getDailyWalletSeries) on the plain Release
      # library above (no sanitizer noise; the sanitized build/ stays for
      # the core's own suite). This catches #44-class core regressions
      # (parse OK, wrong series) in CI instead of on-device.
      - uses: actions/checkout@v4
        with:
          repository: NoahFriehs/NF_Tx_Core_Tester
          ref: main
          path: tester

      - name: Run the tester's ctest against the plain release library
        run: |
          cmake -B tester/build -S tester \
            -DNF_TX_CORE_DIR="$GITHUB_WORKSPACE" \
            -DNF_TX_CORE_SO="$GITHUB_WORKSPACE/build-shared/libNF_Tx_Core.so"
          cmake --build tester/build -j"$(nproc)"
          ctest --test-dir tester/build --output-on-failure
