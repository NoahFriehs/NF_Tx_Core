name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Build + unit tests (with ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run unit tests
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-g -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DNF_TX_CORE_BUILD_TESTS=ON
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Build the shared library (plain, non-sanitized)
        run: |
          cmake -B build-shared -S . -DCMAKE_BUILD_TYPE=Release -DNF_TX_CORE_BUILD_TESTS=OFF
          cmake --build build-shared -j"$(nproc)"
